[project]
name = "ansible-chatbot-stack"
version = "0.1.0"
description = "Automation Intelligent Assistant (AIA)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp==3.14.5", # Transient dep pinned to handle CVE (CVE-2026-34993)
    "anyio==4.14.2", # Minimum version satisfying CVE-2026-63374, CVE-2026-63349, CVE-2026-64847. Also tested as a candidate fix for a cancel-scope RuntimeError (LCORE-4782/AAP-94674) caused by anyio being silently bumped to 4.15.1 by this repo's own dependency resolution while pydantic-ai/pydantic-graph (from the base lightspeed-stack image) are never upgraded -- confirmed via CI that 4.14.1 alone did NOT fix the cancel-scope bug (it's a teardown-ordering issue, not strictly an anyio version regression), so this pin is kept solely for the CVE requirement.
    "cryptography>=50.0.0,<51", # Transient dep pinned to handle CVE
    "dumb-init>=1.2.5.post1",
    "faiss-cpu==1.12",
    "lightspeed-stack-providers==0.6.3",
    "fsspec>=2026.6.0", # CVE-2026-104851
    "litellm==1.91.5", # Pinned below versions with Rust deps to avoid downstream build changes (>=1.84.0 still covers CVE-2026-49468); future litellm CVE fixes will likely only land in compiled releases, so this cap may need revisiting then
    "mcp>=1.28.1,<2",
    "pillow==12.3.0", # Transient dep pinned to handle CVE (CVE-2026-59197, CVE-2026-54058, CVE-2026-54060, CVE-2026-55380, CVE-2026-55379)
    "pydantic-ai==2.22.0", # EXPERIMENTAL (LCORE-4782/AAP-94674): base lightspeed-stack:0.6.2 image bundles 2.0.0; testing whether a newer release fixes a cancel-scope RuntimeError hit when 2+ MCP servers are registered (confirmed via CI: the error disappears with a single MCP server). pydantic-ai#2818/PR #4514 (merged before 2.0.0's release) fixed a related-but-different concurrent-single-server-access cancel-scope bug, so this may not help -- revert if it doesn't.
    "pydantic-graph==2.22.0", # Pinned alongside pydantic-ai -- the two are versioned and released together.
    "python-dotenv>=1.2.2", # Transient dep pinned to handle CVE
    "pyasn1>=0.6.4", # Bumped for CVE-2026-59886
    "pyjwt[crypto]==2.15.1", # Transient dep pinned to handle CVE
    "python-multipart==0.0.32", # CVE-2026-42561
    "sentence-transformers>=5.2.0",
    "transformers>=5.5.0", # Transient dep pinned to handle CVE
    "starlette>=1.3.1",  # Bumped for CVE-2026-54283
    "joserfc>=1.6.8", # Transient dep from authlib, pinned for CVE-2026-48990
    "tornado>=6.5.9", # Transient dep pinned to handle CVE (CVE-2026-91990, CVE-2026-103262)
    "urllib3==2.8.0",
]

[dependency-groups]
dev = [
    "cachetools>=6.1.0",
    "kubernetes>=33.1.0",
    "locust>=2.39.1",
    "pre-commit>=4.2.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "requests>=2.33.0",
]

[tool.pytest.ini_options]
markers = [
    "granite: tests using the in-house Granite LLM via vLLM (requires VLLM_URL, VLLM_API_TOKEN, INFERENCE_MODEL)",
    "openai: tests using the real OpenAI API (requires OPENAI_API_KEY, OPENAI_INFERENCE_MODEL)",
    "azure: tests using Azure OpenAI (requires AZURE_OPENAI_BASE_URL, AZURE_OPENAI_API_KEY, AZURE_OPENAI_INFERENCE_MODEL)",
    "vertexai: tests using Google Vertex AI (requires VERTEX_AI_CREDENTIALS, VERTEX_AI_PROJECT)",
    "byok: tests using BYOK (Bring Your Own Knowledge) vector database alongside the standard AAP RAG",
    "mcp: tests using controller and lightspeed MCP servers against a mock AAP",
]
