# RapiDAST configuration for ansible-chatbot-stack
# Based on Red Hat Product Security RapiDAST templates
# See: https://github.com/RedHatProductSecurity/rapidast

config:
  configVersion: 6

general:
  verbose: true
  container:
    type: "none"

application:
  shortName: "ansible-chatbot-stack"
  url: "http://127.0.0.1:8322"

scanners:
  zap:
    container:
      parameters:
        executable: "zap.sh"
        extraCli: "-config log.level=INFO"
    importUrlsFromFile:
      type: "har"
      fileName: "chatbot-requests.har"
    passiveScan:
      disabledRules: "2,10015,10024,10027,10054,10096,10109,10112"
    activeScan:
      maxScanDurationInMins: 30
    miscOptions:
      additionalAddons: ""
